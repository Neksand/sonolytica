name: Feature request
description: A capability, a query, a harness integration or a model.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What media question cannot be answered today, and what did you try?
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What the answer should look like
      description: |
        A document fact with a range, a new `query` result, an opt-in model —
        and which fixture would prove it works.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - speech / diarization
        - video / OCR
        - music / acoustics
        - query / report / skill
        - distribution / install
        - other
    validations:
      required: true
