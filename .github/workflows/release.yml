name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            features: full-metal
          - runner: macos-13
            target: x86_64-apple-darwin
            features: full
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: full
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Native toolchain
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install cmake ffmpeg; else sudo apt-get update && sudo apt-get install -y cmake libasound2-dev; fi
      - name: Build
        run: |
          cargo build --release -p sonolytica-cli --features ${{ matrix.features }}
          cargo build --release -p sonolytica-eval
      - name: Package
        run: |
          mkdir -p dist
          tar czf dist/sonolytica-${{ matrix.target }}.tar.gz \
            -C target/release sonolytica sonolytica-eval
          (cd dist && shasum -a 256 sonolytica-${{ matrix.target }}.tar.gz > sonolytica-${{ matrix.target }}.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: sonolytica-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
