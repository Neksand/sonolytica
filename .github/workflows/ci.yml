name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (no models, no native runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test without any model feature
        run: cargo test --workspace

  full:
    name: full pipeline (macOS, Metal, native runtimes)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: brew install cmake ffmpeg
      - run: cargo clippy --workspace --all-targets --features "sonolytica-engine/full,sonolytica-engine/metal,sonolytica-cli/full-metal" -- -D warnings
      - name: Test with every provider compiled in
        run: cargo test --workspace --features "sonolytica-engine/full,sonolytica-engine/metal,sonolytica-cli/full-metal"
      # Model-backed tests are opt-in: they need pinned artifacts and macOS `say`.
      # Run them locally with:
      #   SONOLYTICA_E2E=1 cargo test -p sonolytica-engine --features "full,metal" --test e2e_speech

  windows:
    name: windows 11-era x64 (full build)
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg, CMake and LLVM
        run: choco install ffmpeg cmake llvm -y --no-progress
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test without any model feature
        run: cargo test --workspace
      - name: Build full pipeline
        run: cargo build --release -p sonolytica-cli --features full
      - name: Smoke test
        run: |
          .\target\release\sonolytica.exe --version
          .\target\release\sonolytica.exe --help | Select-Object -First 3
      - name: Parse installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      # Model-backed tests are opt-in and use macOS `say`; the Windows job
      # proves the full provider stack compiles and links.

  windows-2022:
    name: windows 10-era x64 (compatibility)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - run: cargo fmt --all -- --check
      - name: Test without any model feature
        run: cargo test --workspace

  licenses:
    name: licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
          arguments: --all-features
