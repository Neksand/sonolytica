[package]
name = "sonolytica-cli"
description = "Command line interface for SONOLYTICA."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "sonolytica"
path = "src/main.rs"

[features]
default = []
silero = ["sonolytica-engine/silero"]
whisper = ["sonolytica-engine/whisper"]
diarize = ["sonolytica-engine/diarize"]
vision = ["sonolytica-engine/vision"]
metal = ["sonolytica-engine/metal"]
full = ["sonolytica-engine/full"]
full-metal = ["full", "metal"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
sonolytica-core = { workspace = true }
sonolytica-engine = { workspace = true }
sonolytica-media = { workspace = true }
sonolytica-providers = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
