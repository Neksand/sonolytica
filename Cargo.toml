[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["SONOLYTICA contributors"]
description = "Multimodal perception infrastructure for AI agents: speech, music, acoustic and video understanding with a unified temporal model."

[workspace.dependencies]
sonolytica-core = { path = "crates/core", version = "0.2.0" }
sonolytica-media = { path = "crates/media", version = "0.2.0" }
sonolytica-dsp = { path = "crates/dsp", version = "0.2.0" }
sonolytica-providers = { path = "crates/providers", version = "0.2.0" }
sonolytica-engine = { path = "crates/engine", version = "0.2.0" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
ebur128 = "0.1"
hound = "3.5"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", features = ["download-binaries", "ndarray"] }
pyannote-rs = { version = "0.3.4", default-features = false }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
whisper-rs = { version = "0.16", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
# Thin LTO is intentionally off: linking the ONNX Runtime prebuilt (CoreML
# objects) under LTO fails on macOS with an undefined
# `__isPlatformVersionAtLeast`. Model inference dominates runtime, not the
# Rust glue; a verified build beats an unverifiable optimization.
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
